esphome:
  name: esp-w-009
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  use_address: esp-w-009.iot

# Enable logging
# logger:

# Enable Home Assistant API
api:

ota:
  platform: esphome

i2c:
  sda: GPIO04
  scl: GPIO05
  frequency: 50kHz

sensor:
  - platform: homeassistant
    id: pm25
    entity_id: sensor.jaume_studio_esp_w_005_pm_2_5

  # - platform: mqtt_subscribe
  #   id: pm2_5
  #   topic: esphome/airquality/sensor/pm_2_5/state

  - platform: scd4x
    co2:
      name: "CO2"
      id: CO2

  - platform: ld2410
    light:
      name: light
    moving_distance:
      name : Moving Distance
    still_distance:
      name: Still Distance
    moving_energy:
      name: Move Energy
    still_energy:
      name: Still Energy
    detection_distance:
      name: Detection Distance

binary_sensor:
  - platform: ld2410
    has_target:
      name: Studio Presence

uart:
  tx_pin: GPIO00
  rx_pin: GPIO01
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:

number:
  - platform: ld2410
    timeout:
      name: Studio presence timeout
    max_move_distance_gate:
      name: Studio max move distance gate
    max_still_distance_gate:
      name: Studio max still distance gate
    g2:
      move_threshold:
        name: Studio g2 move threshold
      still_threshold:
        name: Studio g2 still threshold

switch:
  - platform: ld2410
    bluetooth:
      name: "Studio LD2410 Bluetooth"

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    #reset_pin: D0
    address: 0x3C
    rotation: 90°
    lambda: |-
        it.printf(40,30, id(roboto),TextAlign::TOP_CENTER ,  "AirQ");
        it.printf(0,45, id(roboto_small),TextAlign::TOP_LEFT ,  "PM2.5:");
        it.printf(32,60, id(roboto),TextAlign::TOP_CENTER ,  "%2.0fug/m3", id(pm25).state);
        it.printf(0,85, id(roboto_small),TextAlign::TOP_LEFT ,  "CO2:");
        it.printf(32,100, id(roboto),TextAlign::TOP_CENTER ,  "%2.0fppm", id(CO2).state);

font:
  # gfonts://family[@weight]
  - file: "gfonts://Roboto"
    id: roboto
    size: 12
  - file: "gfonts://Roboto"
    id: roboto_small
    size: 10

