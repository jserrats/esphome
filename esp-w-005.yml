esphome:
  name: esp-w-005

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  use_address: esp-w-005.iot

ota:
  platform: esphome

# Enable logging
logger:

# Enable Home Assistant API
api:

uart:
  rx_pin: 4
  baud_rate: 9600

sensor:
  - platform: pm1006
    pm_2_5:
      name: "PM 2.5"