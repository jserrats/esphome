esphome:
  name: esp-w-041
  on_boot:
    then:
    - light.turn_on:
        id: living_ws2812b
        brightness: 100%
        red: 100%
        green: 60%
        blue: 0%

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  use_address: esp-w-041.iot

logger:

ota:
  platform: esphome

api:

light:
  - platform: neopixelbus
    variant: WS2812
    pin: GPIO8
    num_leds: 8
    name: "Giraffe light"
    id: living_ws2812b
    color_correct: [100%, 100%, 100%]
    effects:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_fireworks:
