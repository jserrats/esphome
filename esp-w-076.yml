          repeat:
            times: 10
            wait_time: 0ms
      - lambda: 'id(light_is_on) = false;'   # All Off also turns the light off

# --- Home Assistant fan + light entities (layered on the buttons above) -------
# One-way RF: no state feedback, so these are optimistic/assumed-state. They just
# trigger the captured-waveform buttons above (no code duplication).
fan:
  - platform: template
    name: "Ceiling Fan"
    id: ceiling_fan
    speed_count: 6
    has_direction: true
    restore_mode: ALWAYS_OFF        # never transmit RF on boot
    on_turn_off:
      - button.press: btn_power     # Power button = OFF only
    on_speed_set:
      - lambda: |-
          // x = target speed 1..6 (pressing a speed also turns the fan on)
          switch (x) {
            case 1: id(btn_speed1).press(); break;
            case 2: id(btn_speed2).press(); break;
            case 3: id(btn_speed3).press(); break;
            case 4: id(btn_speed4).press(); break;
            case 5: id(btn_speed5).press(); break;
            case 6: id(btn_speed6).press(); break;
          }
    on_turn_on:
      - lambda: |-
          // bare power-on: (re)send the current speed
          int s = id(ceiling_fan).speed;
          if (s < 1) s = 1;
          switch (s) {
            case 1: id(btn_speed1).press(); break;
            case 2: id(btn_speed2).press(); break;
            case 3: id(btn_speed3).press(); break;
            case 4: id(btn_speed4).press(); break;
            case 5: id(btn_speed5).press(); break;
            case 6: id(btn_speed6).press(); break;
          }
    on_direction_set:
      - button.press: btn_direction # remote only toggles direction; each change = 1 toggle

# Assumed on/off state of the physical light (one-way toggle, no feedback).
# Guards against spurious toggles when HA issues a redundant command such as
# turn_off while already off (which would otherwise flip the light back on).
globals:
  - id: light_is_on
    type: bool
    restore_value: no
    initial_value: 'false'

# Virtual binary output so the light is a real HA light entity. The physical
# light is a single toggle button, so only press it when the requested state
# actually differs from the assumed state, then record the new state.
output:
  - platform: template
    id: fan_light_out
    type: binary
    write_action:
      - if:
          condition:
            lambda: 'return state != id(light_is_on);'
          then:
            - button.press: btn_light
            - lambda: 'id(light_is_on) = state;'

light:
  - platform: binary
    name: "Fan Light"
    id: fan_light
    output: fan_light_out
    restore_mode: ALWAYS_OFF        # no RF on boot
