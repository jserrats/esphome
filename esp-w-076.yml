esphome:
  name: esp-w-076
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    # One-way RF has no state feedback, so resync to a known baseline on every
    # boot: transmit the remote's "All Off" (fan + light off). Matches the
    # ALWAYS_OFF entity restore below, so assumed state == reality after boot.
    priority: -100          # run after all components (CC1101/SPI) are set up
    then:
      - delay: 3s           # let the CC1101 settle in RX after boot
      - button.press: btn_alloff

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  use_address: esp-w-076.iot

# Enable logging (required to read captured RF codes during stage 1)
logger:

# Enable Home Assistant API
api:

ota:
  platform: esphome

# --- CC1101 sub-GHz transceiver over dual-pin wiring (433.92 MHz) ---
# https://esphome.io/components/cc1101/#1--dual-pin-wiring-recommended
spi:
  clk_pin: GPIO4
  miso_pin: GPIO5
  mosi_pin: GPIO6

cc1101:
  cs_pin: GPIO7
  data_rate: 1MHz          # slower SPI clock — rules out noise on jumper wiring
  frequency: 433.92MHz
  # Squelch the OOK noise floor so only a strong (nearby) remote registers.
  # Relax these (lower attenuation / drop carrier-sense) once codes are captured
  # if you later need to receive weaker/distant signals.
  rx_attenuation: 6dB
  carrier_sense_above_threshold: true
  carrier_sense_abs_thr: 0    # milder squelch: enough to cut idle noise, but not
                              # so aggressive it truncates the 32-bit frame tail
  # output_power / modulation_type (ASK/OOK) / symbol_rate / filter_bandwidth
  # left at defaults; adjust after capture if needed

# GDO0 -> transmit data. begin_tx/begin_rx swap the single CC1101 between
# transmitting and continuous receive.
remote_transmitter:
  pin: GPIO10
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

# GDO2 -> receive data. dump: all prints decoded codes to the log so the
# original fan/light remote can be captured.
remote_receiver:
  pin: GPIO3
  dump: all            # decode every known protocol (rc_switch etc.) + raw
  filter: 60us         # drop sub-60us glitches (real marks are ~240us)
  idle: 20ms           # merge a press's repeats into one on_raw event (debounce)
  # Listen for the PHYSICAL remote and mirror its state into HA (no re-transmit).
  # Decode the raw OOK frame ourselves: 32 bits, mark >450us => '1'. The button id
  # is the stable 3rd byte (code>>8); the low byte drifts +/-55 and is ignored.
  on_raw:
    then:
      - lambda: |-
          const int n = x.size();
          uint32_t code = 0;
          bool found = false;
          // scan candidate frame starts: index 0, or any mark right after a >3ms gap
          for (int start = 0; start + 63 < n && !found; start++) {
            if (x[start] <= 0) continue;                       // must begin on a mark
            if (start != 0 && x[start - 1] > -3000) continue;  // must follow a frame gap
            uint32_t c = 0; bool ok = true;
            for (int b = 0; b < 32; b++) {
              int mv = x[start + b * 2];
              if (mv < 0) { ok = false; break; }               // expected a mark here
              c = (c << 1) | ((mv > 450) ? 1u : 0u);
            }
            if (ok && (c & 0xFFFF0000u) == 0x00F60000u) { code = c; found = true; }
          }
          if (!found) return;                                  // noise / partial frame
          uint8_t bid = (code >> 8) & 0xFF;
          ESP_LOGD("rx", "remote code 0x%08X -> button 0x%02X", code, bid);
          int spd = 0;
          switch (bid) {
            case 0x88: spd = 1; break; case 0x89: spd = 2; break;
            case 0x8E: spd = 3; break; case 0x85: spd = 4; break;
            case 0x87: spd = 5; break; case 0x86: spd = 6; break;
          }
          if (spd) {                                           // speed press -> fan on @ spd
            id(ceiling_fan).state = true;
            id(ceiling_fan).speed = spd;
            id(ceiling_fan).publish_state();
          } else if (bid == 0x8B || bid == 0x83) {             // Power / All Off -> fan off
            id(ceiling_fan).state = false;
            id(ceiling_fan).publish_state();
          } else if (bid == 0x82) {                            // Direction toggle
            id(ceiling_fan).direction =
              (id(ceiling_fan).direction == esphome::fan::FanDirection::FORWARD)
                ? esphome::fan::FanDirection::REVERSE
                : esphome::fan::FanDirection::FORWARD;
            id(ceiling_fan).publish_state();
          }
          if (bid == 0x84) {                                   // Light toggle
            bool ns = !id(light_is_on);
            id(light_is_on) = ns;
            auto c = id(fan_light).make_call(); c.set_state(ns); c.perform();
          } else if (bid == 0x83) {                            // All Off also kills the light
            id(light_is_on) = false;
            auto c = id(fan_light).make_call(); c.set_state(false); c.perform();
          }

# --- Stage 2: Home Assistant controls ----------------------------------------
# Fan/light remote = rc-switch protocol 1, 32-bit OOK, ~240us pulse, 433.92MHz.
# (see github.com/jot-koehler/esp32-cc1101-fan-control). Codes drift +/-55 per
# press; each transmit below replays the EXACT captured waveform of a mid-range
# press (verbatim timings) which the fan's receiver accepts reliably. To
# re-capture a code, use dump: all above and pick one near the spread center.
#
# The six fan-speed waveforms live in scripts because they're each sent from two
# handlers (on_speed_set and on_turn_on); the single-use power/direction/light
# waveforms are inlined directly into their handlers below.
script:
  - id: send_speed1          # captured mid-range code 0x00F68812
    then:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 0Hz
          code: [289, -763, 237, -763, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 736, -263, 736, -263, 736, -289, 237, -763, 736, -263, 763, -263, 237, -789, 736, -263, 263, -763, 237, -763, 263, -763, 736, -289, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 237, -789, 237, -789, 736, -289, 237, -789, 237, -8000]
          repeat:
            times: 10
            wait_time: 0ms
  - id: send_speed2          # captured mid-range code 0x00F68946
    then:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 0Hz
          code: [263, -736, 263, -763, 237, -789, 237, -763, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 736, -289, 710, -289, 736, -289, 210, -789, 736, -289, 710, -289, 237, -789, 736, -289, 237, -789, 210, -789, 237, -763, 763, -263, 210, -789, 237, -763, 736, -263, 237, -789, 736, -263, 210, -789, 237, -763, 237, -789, 736, -289, 736, -263, 237, -763, 237, -8000]
          repeat:
            times: 10
            wait_time: 0ms
  - id: send_speed3          # captured mid-range code 0x00F68E50
    then:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 0Hz
          code: [289, -763, 237, -763, 263, -763, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 736, -263, 763, -263, 736, -263, 237, -763, 736, -263, 763, -263, 237, -789, 736, -263, 237, -763, 237, -763, 263, -763, 736, -289, 736, -289, 710, -289, 237, -763, 237, -789, 736, -263, 237, -763, 763, -263, 210, -789, 237, -763, 237, -789, 237, -789, 237, -8000]
          repeat:
            times: 10
            wait_time: 0ms
  - id: send_speed4          # captured mid-range code 0x00F6855B
    then:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 0Hz
          code: [263, -763, 263, -763, 237, -763, 237, -763, 263, -763, 237, -789, 237, -789, 237, -789, 736, -289, 736, -263, 736, -289, 710, -289, 237, -763, 763, -263, 763, -237, 237, -789, 736, -263, 210, -789, 237, -763, 237, -789, 237, -789, 736, -289, 237, -789, 736, -289, 210, -789, 736, -289, 210, -789, 736, -289, 736, -263, 237, -763, 736, -263, 763, -263, 210, -8000]
          repeat:
            times: 10
            wait_time: 0ms
  - id: send_speed5          # captured mid-range code 0x00F687B7
    then:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 0Hz
          code: [289, -736, 237, -763, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 736, -263, 736, -263, 736, -289, 237, -789, 736, -263, 736, -289, 237, -789, 736, -263, 237, -763, 237, -763, 263, -763, 237, -789, 736, -289, 736, -263, 736, -289, 736, -263, 263, -763, 736, -289, 736, -289, 263, -763, 736, -263, 736, -263, 736, -263, 237, -8000]
          repeat:
            times: 10
            wait_time: 0ms
  - id: send_speed6          # captured mid-range code 0x00F68658
    then:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 0Hz
          code: [289, -736, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 736, -289, 710, -289, 736, -263, 237, -763, 736, -289, 710, -289, 237, -789, 736, -263, 237, -789, 237, -763, 237, -763, 237, -789, 736, -289, 736, -263, 237, -789, 237, -789, 736, -263, 237, -763, 763, -237, 736, -263, 237, -763, 237, -763, 237, -789, 237, -8000]
          repeat:
            times: 10
            wait_time: 0ms

# The only remaining button: a true "All Off" reset. Transmits the remote's
# All Off (fan + light off) AND forces the assumed HA state to off, so the
# optimistic state == reality afterwards. Also invoked from on_boot to sync to
# a known baseline.
button:
  - platform: template
    name: "All Off"          # captured mid-range code 0x00F6833B (fan + light off)
    id: btn_alloff
    entity_category: diagnostic
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 0Hz
          code: [263, -736, 263, -763, 263, -763, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 736, -263, 736, -289, 736, -263, 263, -763, 736, -289, 710, -289, 237, -789, 736, -263, 237, -763, 263, -763, 263, -763, 237, -789, 237, -789, 736, -289, 736, -263, 237, -763, 263, -789, 736, -289, 736, -263, 736, -289, 210, -789, 763, -263, 736, -263, 237, -8000]
          repeat:
            times: 10
            wait_time: 0ms
      - lambda: |-
          // Force the assumed HA state to match the "all off" we just sent.
          // Set the fan .state directly + publish (this does NOT re-trigger
          // on_turn_off's RF). For the light, clear the global first so the
          // output's write_action sees no change and skips a redundant RF press;
          // the make_call just republishes the entity as off.
          id(ceiling_fan).state = false;
          id(ceiling_fan).publish_state();
          id(light_is_on) = false;
          auto c = id(fan_light).make_call();
          c.set_state(false);
          c.perform();

# --- Home Assistant fan + light entities (layered on the transmits above) -----
# One-way RF: no state feedback, so these are optimistic/assumed-state. They
# replay the captured waveforms (speeds via scripts, power/direction inlined).
fan:
  - platform: template
    name: "Ceiling Fan"
    id: ceiling_fan
    speed_count: 6
    has_direction: true
    restore_mode: ALWAYS_OFF        # never transmit RF on boot
    on_turn_off:
      - remote_transmitter.transmit_raw:   # Power button = OFF only, code 0x00F68B33
          carrier_frequency: 0Hz
          code: [263, -736, 263, -789, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 736, -289, 710, -289, 736, -263, 237, -789, 736, -289, 736, -263, 237, -789, 736, -289, 210, -789, 237, -789, 237, -789, 736, -289, 237, -789, 736, -289, 710, -289, 237, -763, 237, -789, 736, -289, 736, -263, 237, -789, 237, -789, 736, -289, 736, -263, 237, -8000]
          repeat:
            times: 10
            wait_time: 0ms
    on_speed_set:
      - lambda: |-
          // x = target speed 1..6 (pressing a speed also turns the fan on)
          switch (x) {
            case 1: id(send_speed1).execute(); break;
            case 2: id(send_speed2).execute(); break;
            case 3: id(send_speed3).execute(); break;
            case 4: id(send_speed4).execute(); break;
            case 5: id(send_speed5).execute(); break;
            case 6: id(send_speed6).execute(); break;
          }
    on_turn_on:
      - lambda: |-
          // bare power-on: (re)send the current speed
          int s = id(ceiling_fan).speed;
          if (s < 1) s = 1;
          switch (s) {
            case 1: id(send_speed1).execute(); break;
            case 2: id(send_speed2).execute(); break;
            case 3: id(send_speed3).execute(); break;
            case 4: id(send_speed4).execute(); break;
            case 5: id(send_speed5).execute(); break;
            case 6: id(send_speed6).execute(); break;
          }
    on_direction_set:
      - remote_transmitter.transmit_raw:   # direction toggle, code 0x00F6823A
          carrier_frequency: 0Hz
          code: [263, -789, 237, -763, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 736, -289, 710, -289, 736, -263, 263, -789, 710, -289, 736, -263, 237, -789, 736, -263, 237, -763, 237, -789, 237, -763, 263, -763, 237, -789, 736, -289, 210, -789, 237, -763, 263, -763, 736, -263, 736, -263, 736, -289, 237, -763, 736, -263, 237, -763, 237, -8000]
          repeat:
            times: 10
            wait_time: 0ms

# Assumed on/off state of the physical light (one-way toggle, no feedback).
# Guards against spurious toggles when HA issues a redundant command such as
# turn_off while already off (which would otherwise flip the light back on).
globals:
  - id: light_is_on
    type: bool
    restore_value: no
    initial_value: 'false'

# Virtual binary output so the light is a real HA light entity. The physical
# light is a single toggle button, so only transmit when the requested state
# actually differs from the assumed state, then record the new state.
output:
  - platform: template
    id: fan_light_out
    type: binary
    write_action:
      - if:
          condition:
            lambda: 'return state != id(light_is_on);'
          then:
            - remote_transmitter.transmit_raw:   # Light toggle, code 0x00F68469
                carrier_frequency: 0Hz
                code: [263, -763, 237, -763, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 237, -789, 736, -289, 736, -263, 736, -289, 736, -237, 237, -763, 763, -263, 763, -263, 237, -789, 736, -263, 237, -763, 237, -763, 237, -789, 237, -789, 736, -289, 237, -789, 237, -789, 237, -789, 736, -289, 736, -263, 237, -763, 763, -263, 237, -763, 237, -789, 736, -289, 210, -8000]
                repeat:
                  times: 10
                  wait_time: 0ms
            - lambda: 'id(light_is_on) = state;'

light:
  - platform: binary
    name: "Fan Light"
    id: fan_light
    output: fan_light_out
    restore_mode: ALWAYS_OFF        # no RF on boot
